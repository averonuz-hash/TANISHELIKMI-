<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AVERON — Brando Smart TV 43</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*
 * AVERON promo — Brando Smart TV 43".
 * Deterministic renderer: window.drawFrame(t) paints the frame at time t (seconds).
 * 1080x1920 (9:16), 20 s. Music is 120 BPM -> beat = 0.5 s.
 *
 * Optional: put a real product photo (transparent PNG) next to this file as
 * product.png and open scene.html?photo=1 — it replaces the drawn main TV.
 */
const W = 1080, H = 1920, DUR = 20, BEAT = 0.5;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- brand ----------
const BLUE = '#0B4DFF', RED = '#FF2D3B', INK = '#0D1321', GRAY = '#5B6475', YEL = '#FFD23F', GREEN = '#22C55E';
const FONT = 'Inter';

// ---------- scene table ----------
const S = {
  intro:  [0.0, 2.5],
  product:[2.5, 7.0],
  wall:   [7.0, 10.0],
  cash:   [10.0, 13.5],
  credit: [13.5, 16.5],
  cta:    [16.5, 20.0],
};
const PHONES = ['50-772-25-00', '77-200-85-04'];

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const backOut = (k, s = 1.9) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const beatPulse = t => Math.exp(-((t % BEAT) / BEAT) * 6);
const win = (t, a, b, fi = .25, fo = .25) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
function rand(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function text(str, x, y, { size = 80, weight = 900, color = INK, align = 'center', spacing = 0, alpha = 1, shadow = null } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.letterSpacing = spacing + 'px';
  if (shadow) { ctx.shadowColor = shadow.c; ctx.shadowBlur = shadow.b; ctx.shadowOffsetY = shadow.y || 0; }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.restore();
}
function measure(str, size, weight = 900, spacing = 0) {
  ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(str).width; ctx.restore(); return w;
}
function pill(str, cx, cy, { size = 44, fg = '#fff', bg = INK, padX = 36, padY = 20, alpha = 1, scale = 1, rot = 0 } = {}) {
  const w = measure(str, size, 800, 2) + padX * 2, h = size + padY * 2;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.shadowColor = 'rgba(13,19,33,.18)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  rr(-w / 2, -h / 2, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  ctx.shadowColor = 'transparent';
  text(str, 0, 2, { size, weight: 800, color: fg, spacing: 2 });
  ctx.restore();
}
function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

// ---------- TV screen content: animated landscape ----------
function landscape(w, h, t, hue) {
  const sky = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  sky.addColorStop(0, `hsl(${hue},85%,45%)`);
  sky.addColorStop(.55, `hsl(${hue + 35},95%,66%)`);
  sky.addColorStop(1, `hsl(${hue + 60},100%,72%)`);
  ctx.fillStyle = sky; ctx.fillRect(-w / 2, -h / 2, w, h);
  // sun + glow
  const sx = w * .18, sy = -h * .02;
  const glow = ctx.createRadialGradient(sx, sy, 2, sx, sy, h * .55);
  glow.addColorStop(0, 'rgba(255,250,220,.95)'); glow.addColorStop(.18, 'rgba(255,230,160,.6)'); glow.addColorStop(1, 'rgba(255,200,120,0)');
  ctx.fillStyle = glow; ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.fillStyle = '#FFF6DA'; ctx.beginPath(); ctx.arc(sx, sy, h * .09, 0, 7); ctx.fill();
  // mountains (parallax)
  const layers = [
    { y: .10, a: .16, sp: 12, l: 62, c: 30 },
    { y: .20, a: .13, sp: 26, l: 42, c: 40 },
    { y: .30, a: .10, sp: 48, l: 24, c: 50 },
  ];
  layers.forEach((L, i) => {
    ctx.beginPath(); ctx.moveTo(-w / 2, h / 2);
    for (let x = -w / 2; x <= w / 2 + 8; x += 8) {
      const u = (x + t * L.sp) / w;
      const y = h * L.y - h * L.a * (Math.sin(u * 7 + i * 2) * .6 + Math.sin(u * 15 + i) * .3 + Math.sin(u * 31) * .1 + 1);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(w / 2, h / 2); ctx.closePath();
    ctx.fillStyle = `hsl(${hue + L.c + 180},45%,${L.l}%)`; ctx.fill();
  });
  // water with shimmer
  const wy = h * .30;
  const wg = ctx.createLinearGradient(0, wy, 0, h / 2);
  wg.addColorStop(0, `hsl(${hue + 200},70%,40%)`); wg.addColorStop(1, `hsl(${hue + 210},80%,18%)`);
  ctx.fillStyle = wg; ctx.fillRect(-w / 2, wy, w, h / 2 - wy);
  ctx.fillStyle = 'rgba(255,240,200,.55)';
  for (let i = 0; i < 9; i++) {
    const yy = wy + 6 + i * (h * .022);
    const ww = w * (.14 - i * .012) * (1 + .25 * Math.sin(t * 3 + i));
    ctx.fillRect(sx - ww / 2 + Math.sin(t * 2 + i * 1.7) * 6, yy, ww, 3);
  }
  // birds
  ctx.strokeStyle = 'rgba(20,20,40,.6)'; ctx.lineWidth = Math.max(1.5, w / 400);
  for (let i = 0; i < 3; i++) {
    const bx = ((t * 40 + i * 120) % (w * 1.3)) - w * .65, by = -h * .28 + i * h * .05, s = w * .012;
    const f = Math.sin(t * 8 + i) * s * .6;
    ctx.beginPath(); ctx.moveTo(bx - s, by - f); ctx.quadraticCurveTo(bx - s * .4, by - s * .2, bx, by); ctx.quadraticCurveTo(bx + s * .4, by - s * .2, bx + s, by - f); ctx.stroke();
  }
}

// ---------- TV ----------
let photo = null;
function tv(cx, cy, w, t, { hue = 200, yaw = 0, stand = true, on = 1, main = false } = {}) {
  if (main && photo) {
    ctx.save(); ctx.translate(cx, cy);
    const ph = w * photo.height / photo.width;
    shadowEllipse(0, ph / 2 + 8, w * .45);
    ctx.drawImage(photo, -w / 2, -ph / 2, w, ph); ctx.restore(); return;
  }
  const h = w * 9 / 16, bz = Math.max(4, w * .012), depth = w * .035;
  const c = Math.cos(yaw), s = Math.sin(yaw), PERS = .10;
  ctx.save(); ctx.translate(cx, cy);
  if (stand) {
    shadowEllipse(0, h / 2 + w * .075, w * .5);
    // two feet
    ctx.fillStyle = '#1A1F2B';
    for (const fx of [-.38, .38]) {
      ctx.save(); ctx.translate(fx * w * c, h / 2);
      ctx.beginPath(); ctx.moveTo(-w * .012, 0); ctx.lineTo(w * .012, 0); ctx.lineTo(w * .045 * Math.sign(fx), w * .07); ctx.lineTo(w * .02 * Math.sign(fx), w * .07); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }
  // side thickness
  if (Math.abs(s) > .01) {
    const xe = (s > 0 ? w / 2 : -w / 2) * c, ye = (s > 0 ? w / 2 : -w / 2) * s * PERS;
    ctx.fillStyle = '#2B3242';
    ctx.beginPath();
    ctx.moveTo(xe, -h / 2 + ye); ctx.lineTo(xe + depth * s * 2, -h / 2 + ye + 4); ctx.lineTo(xe + depth * s * 2, h / 2 + ye - 4); ctx.lineTo(xe, h / 2 + ye);
    ctx.closePath(); ctx.fill();
  }
  ctx.transform(c, s * PERS, 0, 1, 0, 0);
  // body / bezel
  ctx.save();
  ctx.shadowColor = 'rgba(10,15,35,.35)'; ctx.shadowBlur = w * .05; ctx.shadowOffsetY = w * .02;
  rr(-w / 2, -h / 2, w, h, w * .012); ctx.fillStyle = '#0E121B'; ctx.fill();
  ctx.restore();
  // screen
  const sw = w - bz * 2, sh = h - bz * 2;
  ctx.save(); rr(-sw / 2, -sh / 2, sw, sh, w * .006); ctx.clip();
  ctx.fillStyle = '#05070C'; ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
  if (on > 0) {
    ctx.save(); ctx.globalAlpha = on;
    // "power on" reveal: horizontal line opening up
    const open = clamp(on * 1.4);
    ctx.beginPath(); ctx.rect(-sw / 2, -sh / 2 * open, sw, sh * open); ctx.clip();
    landscape(sw, sh, t, hue);
    ctx.restore();
  }
  // glass gloss
  const gl = ctx.createLinearGradient(-sw / 2, -sh / 2, sw / 2, sh / 2);
  gl.addColorStop(0, 'rgba(255,255,255,.18)'); gl.addColorStop(.35, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
  // moving specular sweep
  const sx = lerp(-sw, sw, ((yaw + .3) / .6));
  const sg = ctx.createLinearGradient(sx - w * .12, 0, sx + w * .12, 0);
  sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.16)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(-sw / 2, -sh / 2, sw, sh);
  ctx.restore();
  // tiny power LED
  ctx.fillStyle = on > 0 ? '#FFFFFF' : '#FF3B3B'; ctx.globalAlpha = .7;
  ctx.beginPath(); ctx.arc(0, h / 2 - bz / 2, Math.max(1, bz * .25), 0, 7); ctx.fill();
  ctx.restore();
}
function shadowEllipse(x, y, rx) {
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 4, x, y, rx);
  g.addColorStop(0, 'rgba(15,25,50,.30)'); g.addColorStop(1, 'rgba(15,25,50,0)');
  ctx.fillStyle = g; ctx.translate(x, y); ctx.scale(1, .14); ctx.beginPath(); ctx.arc(0, 0, rx, 0, 7); ctx.fill();
  ctx.restore();
}

// ---------- background: modern electronics store ----------
const SHOWROOM = (() => { // blurred TVs on the back wall
  const r = rand(5), out = [];
  for (let row = 0; row < 3; row++) for (let i = 0; i < 4; i++) {
    out.push({ x: 140 + i * 270 + (row % 2) * 70 + (r() - .5) * 40, y: 300 + row * 560 + (r() - .5) * 60, w: 170 + r() * 110, hue: Math.floor(r() * 360) });
  }
  return out;
})();
function background(t, blueMix) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#FFFFFF'); g.addColorStop(.6, '#F3F6FB'); g.addColorStop(1, '#E4EAF4');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // blurred showroom wall with glowing TVs (slow parallax drift)
  ctx.save();
  ctx.filter = 'blur(10px)';
  ctx.globalAlpha = .28;
  const drift = Math.sin(t * .3) * 30;
  for (const s of SHOWROOM) {
    const h = s.w * 9 / 16;
    ctx.fillStyle = `hsl(${(s.hue + t * 20) % 360},80%,60%)`;
    rr(s.x - s.w / 2 + drift, s.y - h / 2, s.w, h, 6); ctx.fill();
  }
  ctx.restore();
  // ceiling light strips
  ctx.save(); ctx.globalAlpha = .5;
  for (let i = 0; i < 3; i++) {
    const lg = ctx.createLinearGradient(0, 0, 0, 40);
    lg.addColorStop(0, 'rgba(255,255,255,1)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = lg; ctx.fillRect(80 + i * 340, 0, 240, 40);
  }
  ctx.restore();
  // glossy floor
  const fg = ctx.createLinearGradient(0, 1380, 0, H);
  fg.addColorStop(0, 'rgba(11,77,255,0)'); fg.addColorStop(1, 'rgba(11,77,255,.07)');
  ctx.fillStyle = fg; ctx.fillRect(0, 1380, W, H - 1380);

  if (blueMix > 0) {
    ctx.save(); ctx.globalAlpha = blueMix;
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#1F63FF'); bg.addColorStop(1, '#0526A0');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    ctx.translate(W / 2, 480); ctx.rotate(t * .25);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(1700, -120); ctx.lineTo(1700, 120); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
}

// ---------- effects ----------
function burst(cx, cy, k, color, n = 14, r0 = 60, r1 = 360) {
  if (k <= 0 || k >= 1) return;
  ctx.save(); ctx.translate(cx, cy); ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineWidth = 14 * (1 - k);
  const e = easeOut(k);
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, ra = lerp(r0, r1, e), rb = lerp(r0, r1, Math.min(1, e * 1.35));
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * ra, Math.sin(a) * ra); ctx.lineTo(Math.cos(a) * rb, Math.sin(a) * rb); ctx.stroke();
  }
  ctx.restore();
}
function ring(cx, cy, k, color, r1 = 600) {
  if (k <= 0 || k >= 1) return;
  ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = color; ctx.lineWidth = 30 * (1 - k) + 2;
  ctx.beginPath(); ctx.arc(cx, cy, easeOut(k) * r1, 0, 7); ctx.stroke(); ctx.restore();
}
function flash(k) { if (k <= 0 || k >= 1) return; ctx.save(); ctx.globalAlpha = (1 - k) * .85; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
function star4(x, y, s, color, a) {
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = color; ctx.translate(x, y);
  ctx.beginPath(); ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s); ctx.fill();
  ctx.restore();
}
function sparkles(t, cx, cy, spread, seed, color = YEL, ySpread = spread * .6) {
  const r = rand(seed);
  for (let i = 0; i < 10; i++) {
    const x = cx + (r() - .5) * spread, y = cy + (r() - .5) * ySpread, ph = r() * 3;
    const k = (Math.sin(t * 5 + ph * 4) + 1) / 2;
    star4(x, y, 8 + k * 16, color, k);
  }
}
function wipe(k, color) {
  if (k <= 0 || k >= 1) return;
  const x = lerp(-W * 1.6, W * 1.6, easeInOut(k));
  ctx.save(); ctx.translate(x, 0); ctx.rotate(.18);
  ctx.fillStyle = color; ctx.fillRect(-W * .55, -400, W * 1.1, H + 800);
  ctx.fillStyle = YEL; ctx.fillRect(W * .55, -400, 40, H + 800);
  ctx.restore();
}
// spiky sale badge
function saleBadge(cx, cy, r, t, lines, { bg = RED, fg = '#fff', scale = 1, alpha = 1 } = {}) {
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.save(); ctx.rotate(t * .6);
  ctx.beginPath();
  const n = 18;
  for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * Math.PI * 2, rad = i % 2 ? r * .86 : r; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); }
  ctx.closePath();
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 20; ctx.shadowOffsetY = 8;
  ctx.fillStyle = bg; ctx.fill();
  ctx.restore();
  ctx.rotate(-.18);
  lines.forEach((l, i) => text(l.s, 0, (i - (lines.length - 1) / 2) * l.size * 1.05, { size: l.size, weight: 900, color: l.c || fg }));
  ctx.restore();
}
function logo(cx, cy, size, t, { color = INK, accent = BLUE, alpha = 1, stagger = null } = {}) {
  const word = 'AVERON', sp = size * .08;
  let x = cx - measure(word, size, 900, sp) / 2;
  ctx.save(); ctx.globalAlpha *= alpha;
  for (let i = 0; i < word.length; i++) {
    const ch = word[i], w = measure(ch, size, 900, sp);
    let dy = 0, sc = 1, a = 1;
    if (stagger !== null) {
      const k = seg(t, stagger + i * .07, stagger + i * .07 + .35);
      dy = (1 - backOut(k)) * -size * 1.2; sc = lerp(1.6, 1, easeOut(k)); a = clamp(k * 3);
    }
    ctx.save(); ctx.translate(x + w / 2, cy + dy); ctx.scale(sc, sc);
    text(ch, 0, 0, { size, weight: 900, color: i === 0 ? accent : color, alpha: a });
    ctx.restore();
    x += w;
  }
  ctx.restore();
}
function phoneIcon(x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 30) * .12 * (Math.sin(t * Math.PI * 2) > .3));
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-s * .62, -s * .78);
  ctx.quadraticCurveTo(-s * .95, -s * .5, -s * .7, 0);
  ctx.quadraticCurveTo(-s * .2, s * .75, s * .5, s * .78);
  ctx.quadraticCurveTo(s * .8, s * .8, s * .85, s * .5);
  ctx.lineTo(s * .45, s * .2);
  ctx.quadraticCurveTo(s * .25, s * .3, s * .1, s * .35);
  ctx.quadraticCurveTo(-s * .25, s * .1, -s * .35, -s * .15);
  ctx.quadraticCurveTo(-s * .3, -s * .3, -s * .2, -s * .45);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function phoneButton(num, cx, cy, k, t, phase) {
  if (k <= 0) return;
  const pulse = 1 + Math.exp(-(((t + phase) % 1) / 1) * 6) * .05;
  ctx.save(); ctx.translate(cx, cy); const sc = backOut(k) * pulse; ctx.scale(sc, sc);
  const bw = 880, bh = 150;
  ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 14;
  rr(-bw / 2, -bh / 2, bw, bh, bh / 2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = GREEN; ctx.beginPath(); ctx.arc(-bw / 2 + 80, 0, 54, 0, 7); ctx.fill();
  phoneIcon(-bw / 2 + 80, 0, 30, t + phase);
  text(num, 60, 4, { size: 86, weight: 900, color: INK, spacing: 1 });
  ctx.restore();
}

// ---------- wall of TVs ("all sizes available") ----------
const WALL = [
  { x: 200, y: 690, w: 300, hue: 300, d: 0 },
  { x: 880, y: 680, w: 330, hue: 120, d: .12 },
  { x: 540, y: 640, w: 250, hue: 20,  d: .24 },
  { x: 180, y: 1320, w: 270, hue: 260, d: .36 },
  { x: 890, y: 1330, w: 320, hue: 170, d: .48 },
  { x: 540, y: 1470, w: 400, hue: 340, d: .60 },
];

// ---------- frame ----------
function drawFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const ctaK = easeInOut(seg(t, S.cta[0] - .1, S.cta[0] + .35));
  background(t, ctaK);

  const hits = [0.0, S.product[0], S.cash[0] + .5, S.credit[0], S.cta[0]];
  let shake = 0; for (const h0 of hits) { const d = t - h0; if (d >= 0 && d < .3) shake = Math.max(shake, (1 - d / .3) * 14); }
  if (shake) ctx.translate(Math.sin(t * 90) * shake, Math.cos(t * 77) * shake);

  // ================= INTRO: AVERON doʻkonida ULKAN CHEGIRMA! =================
  if (t < S.intro[1] + .1) {
    ring(W / 2, 640, seg(t, 0, .9), BLUE, 900);
    ring(W / 2, 640, seg(t, .15, 1.1), RED, 700);
    ctx.save(); ctx.translate(W / 2, 640);
    const dk = backOut(seg(t, .05, .5)); ctx.scale(dk, dk);
    ctx.fillStyle = BLUE; ctx.beginPath(); ctx.arc(0, 0, 360 + beatPulse(t) * 12, 0, 7); ctx.fill();
    ctx.restore();
    logo(W / 2, 600, 118, t, { color: '#fff', accent: YEL, stagger: .1 });
    text('doʻkonida', W / 2, 715, { size: 56, weight: 700, color: 'rgba(255,255,255,.92)', alpha: seg(t, .55, .8) });
    // ULKAN CHEGIRMA!
    const k1 = seg(t, .8, 1.15);
    if (k1 > 0) {
      ctx.save(); ctx.translate(W / 2, 1160); ctx.rotate(-.04); const sc = lerp(2.4, 1, easeOut(k1)); ctx.scale(sc, sc);
      text('ULKAN', 0, 0, { size: 190, weight: 900, color: RED, alpha: clamp(k1 * 2), spacing: 4, shadow: { c: 'rgba(255,45,59,.35)', b: 30, y: 10 } });
      ctx.restore();
    }
    const k2 = seg(t, 1.1, 1.45);
    if (k2 > 0) {
      ctx.save(); ctx.translate(W / 2, 1345); ctx.rotate(-.04);
      const bw = 900 * easeOut(k2);
      ctx.fillStyle = YEL; rr(-bw / 2, -85, bw, 170, 24); ctx.fill();
      ctx.beginPath(); ctx.rect(-bw / 2, -100, bw, 200); ctx.clip();
      text('CHEGIRMA!', 0, 6, { size: 130, weight: 900, color: INK, spacing: 2 });
      ctx.restore();
    }
    burst(W / 2, 1250, seg(t, 1.1, 1.7), YEL, 18, 420, 640);
    sparkles(t, W / 2, 640, 900, 3);
  }

  // ================= MAIN TV =================
  if (t >= S.product[0] - .05) {
    const enter = seg(t, S.product[0], S.product[0] + .7);
    let cx = W / 2 + (1 - easeOut(enter)) * -800, cy = 960, w = lerp(560, 960, backOut(enter, 1.3));
    // wall scene: shrink to centre of the wall
    const toWall = easeInOut(seg(t, S.wall[0] - .1, S.wall[0] + .5));
    cy = lerp(cy, 1000, toWall); w = lerp(w, 540, toWall);
    // prices: move up
    const toPrice = easeInOut(seg(t, S.cash[0] - .2, S.cash[0] + .4));
    cy = lerp(cy, 640, toPrice); w = lerp(w, 820, toPrice);
    const toCta = easeInOut(seg(t, S.cta[0] - .1, S.cta[0] + .4));
    cy = lerp(cy, 470, toCta); w = lerp(w, 560, toCta);
    const yaw = Math.sin((t - S.product[0]) * .9) * .22 * (1 - toWall * .7);
    const on = seg(t, S.product[0] + .35, S.product[0] + .85);
    const bob = Math.sin(t * Math.PI) * 5;
    if (toCta > 0) {
      ctx.save(); ctx.globalAlpha = toCta; const hg = ctx.createRadialGradient(W / 2, cy, 50, W / 2, cy, 460);
      hg.addColorStop(0, 'rgba(255,255,255,.5)'); hg.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = hg; ctx.fillRect(0, cy - 480, W, 960); ctx.restore();
    }
    ctx.save(); ctx.globalAlpha = clamp(enter * 2);
    tv(cx, cy + bob, w * (1 + beatPulse(t) * .01), t, { hue: 15 + Math.sin(t * .4) * 6, yaw, on, main: true });
    ctx.restore();

    // 43" badge on the TV corner
    const bk = win(t, S.product[0] + .9, S.wall[0] + .1, .35, .3);
    if (bk > 0) {
      const h = w * 9 / 16;
      saleBadge(cx + w * .42, cy - h * .5 - 20, 120, t, [{ s: '43″', size: 92 }, { s: 'dyuym', size: 34 }], { bg: YEL, fg: INK, scale: backOut(seg(t, S.product[0] + .9, S.product[0] + 1.25)), alpha: bk });
    }
    // sale badge during prices
    const sk = win(t, S.cash[0] + .3, S.cta[0], .3, .3);
    if (sk > 0) {
      const h = w * 9 / 16;
      saleBadge(cx + w * .40, cy - h * .5 - 10, 125, t, [{ s: 'ULKAN', size: 40 }, { s: 'CHEGIRMA', size: 34 }], { bg: RED, scale: backOut(seg(t, S.cash[0] + .3, S.cash[0] + .65)), alpha: sk });
    }
  }

  // ================= PRODUCT title =================
  {
    const a = win(t, S.product[0] + .3, S.wall[0], .3, .3);
    if (a > 0) {
      const k1 = easeOut(seg(t, S.product[0] + .3, S.product[0] + .8));
      const k2 = easeOut(seg(t, S.product[0] + .45, S.product[0] + .95));
      ctx.save(); ctx.globalAlpha = a;
      // SMART TV blue tag
      const bw = measure('SMART TV', 72, 900, 6) + 70;
      ctx.save(); ctx.translate(W / 2 + (1 - k1) * 700, 225); ctx.rotate(-.03);
      ctx.fillStyle = BLUE; rr(-bw / 2, -54, bw, 108, 22); ctx.fill();
      text('SMART TV', 0, 3, { size: 72, weight: 900, color: '#fff', spacing: 6 });
      ctx.restore();
      text('BRANDO', W / 2 - (1 - k2) * 700, 375, { size: 160, weight: 900, color: INK, spacing: 6 });
      // tagline under TV
      const k3 = seg(t, S.product[0] + 1.2, S.product[0] + 1.6);
      const k4 = seg(t, S.product[0] + 1.4, S.product[0] + 1.8);
      text('Zamonaviy oila uchun', W / 2, 1450 + (1 - easeOut(k3)) * 40, { size: 60, weight: 700, color: GRAY, alpha: k3 });
      ctx.save(); ctx.translate(W / 2, 1560); const sc = backOut(k4); ctx.scale(sc, sc);
      if (k4 > 0) text('ENG YAXSHI TANLOV!', 0, 0, { size: 84, weight: 900, color: RED, spacing: 2 });
      ctx.restore();
      ctx.restore();
    }
    burst(W / 2, 960, seg(t, S.product[0] + .2, S.product[0] + .8), YEL, 16, 480, 700);
  }

  // ================= WALL: barcha oʻlchamdagi televizorlar =================
  {
    const a = 1 - seg(t, S.cash[0] - .3, S.cash[0]);
    if (t > S.wall[0] - .05 && a > 0) {
      ctx.save(); ctx.globalAlpha = a;
      for (const tvw of WALL) {
        const k = seg(t, S.wall[0] + tvw.d, S.wall[0] + tvw.d + .4);
        if (k <= 0) continue;
        tv(tvw.x, tvw.y, tvw.w * backOut(k), t, { hue: tvw.hue, stand: false, on: seg(t, S.wall[0] + tvw.d + .2, S.wall[0] + tvw.d + .6) });
      }
      const k1 = seg(t, S.wall[0] + .1, S.wall[0] + .4);
      const k2 = seg(t, S.wall[0] + .3, S.wall[0] + .7);
      text('Doʻkonimizda', W / 2, 200, { size: 60, weight: 700, color: GRAY, alpha: k1 });
      ctx.save(); ctx.translate(W / 2, 310); const sc = backOut(k2); ctx.scale(sc, sc);
      if (k2 > 0) text('BARCHA OʻLCHAMDAGI', 0, 0, { size: 86, weight: 900, color: BLUE, spacing: 1 });
      ctx.restore();
      const k3 = seg(t, S.wall[0] + .6, S.wall[0] + .9);
      text('televizorlar mavjud!', W / 2, 410, { size: 70, weight: 900, color: INK, alpha: k3 });
      ctx.restore();
    }
  }

  // ================= CASH PRICE =================
  {
    const a = win(t, S.cash[0], S.credit[0] + .05, .2, .3);
    if (a > 0) {
      ctx.save(); ctx.globalAlpha = a;
      const lk = seg(t, S.cash[0], S.cash[0] + .35);
      pill('NAQD PULGA ATIGI', W / 2, 1110, { size: 52, bg: INK, scale: backOut(lk), padX: 44, padY: 22 });
      const ck = easeOut(seg(t, S.cash[0] + .1, S.cash[0] + .5));
      const val = lerp(0, 2155999, ck);
      const slam = seg(t, S.cash[0] + .5, S.cash[0] + .8);
      const sc = 1 + (1 - backOut(slam, 3)) * .25 + beatPulse(t) * .03 * (slam >= 1);
      ctx.save(); ctx.translate(W / 2, 1290); ctx.scale(sc, sc); ctx.rotate(-.02);
      text(fmt(val), 0, 0, { size: 186, weight: 900, color: RED, spacing: -4, shadow: { c: 'rgba(255,45,59,.35)', b: 30, y: 10 } });
      ctx.restore();
      text('soʻm', W / 2, 1445, { size: 82, weight: 900, color: INK, alpha: slam });
      burst(W / 2, 1290, seg(t, S.cash[0] + .5, S.cash[0] + 1.0), RED, 18, 400, 640);
      sparkles(t, W / 2, 1290, 900, 11, RED);
      ctx.restore();
    }
  }

  // ================= INSTALLMENT =================
  {
    const a = win(t, S.credit[0], S.cta[0] + .05, .2, .3);
    if (a > 0) {
      ctx.save(); ctx.globalAlpha = a;
      const lk = seg(t, S.credit[0], S.credit[0] + .35);
      pill('YOKI OYIGA', W / 2, 1090, { size: 50, bg: BLUE, scale: backOut(lk), padX: 44, padY: 22 });
      const k = seg(t, S.credit[0] + .15, S.credit[0] + .55);
      const sc = lerp(2.2, 1, easeOut(k)) + beatPulse(t) * .03 * (k >= 1);
      ctx.save(); ctx.translate(W / 2, 1265); ctx.scale(sc, sc);
      text('279 999', 0, 0, { size: 200, weight: 900, color: BLUE, spacing: -4, alpha: clamp(k * 2), shadow: { c: 'rgba(11,77,255,.35)', b: 30, y: 10 } });
      ctx.restore();
      const k2 = seg(t, S.credit[0] + .5, S.credit[0] + .8);
      text('soʻmdan', W / 2, 1415, { size: 76, weight: 900, color: INK, alpha: k2 });
      const k3 = seg(t, S.credit[0] + .8, S.credit[0] + 1.15);
      if (k3 > 0) pill('12 OYGA BOʻLIB TOʻLANG!', W / 2, 1560, { size: 52, bg: RED, scale: backOut(k3), rot: -.03, padX: 46, padY: 24 });
      ring(W / 2, 1265, seg(t, S.credit[0] + .15, S.credit[0] + .9), BLUE, 650);
      ctx.restore();
    }
  }

  // ================= CTA =================
  if (t > S.cta[0] - .1) {
    const c0 = S.cta[0];
    logo(W / 2, 150, 104, t, { color: '#fff', accent: YEL, alpha: seg(t, c0, c0 + .4) });
    const k1 = seg(t, c0 + .2, c0 + .55);
    if (k1 > 0) {
      ctx.save(); ctx.translate(W / 2, 830); const sc = backOut(k1); ctx.scale(sc, sc);
      text('KELIB KOʻRING,', 0, -55, { size: 84, weight: 900, color: '#fff', spacing: 2 });
      text('NARXGA ISHONING!', 0, 45, { size: 84, weight: 900, color: YEL, spacing: 2 });
      ctx.restore();
    }
    text('Qoʻngʻiroq qiling:', W / 2, 1000, { size: 48, weight: 700, color: 'rgba(255,255,255,.9)', alpha: seg(t, c0 + .45, c0 + .7) });
    phoneButton(PHONES[0], W / 2, 1110, seg(t, c0 + .5, c0 + .85), t, 0);
    phoneButton(PHONES[1], W / 2, 1290, seg(t, c0 + .7, c0 + 1.05), t, .5);
    const k3 = seg(t, c0 + 1.0, c0 + 1.3);
    if (k3 > 0) {
      ctx.save(); ctx.globalAlpha = k3;
      const y = 1480 + (1 - easeOut(k3)) * 60;
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      rr(70, y - 70, 445, 140, 28); ctx.fill();
      rr(565, y - 70, 445, 140, 28); ctx.fill();
      text('NAQD', 292, y - 34, { size: 32, weight: 700, color: 'rgba(255,255,255,.8)', spacing: 3 });
      text('2 155 999 soʻm', 292, y + 18, { size: 52, weight: 900, color: '#fff' });
      text('12 OY × OYIGA', 787, y - 34, { size: 32, weight: 700, color: 'rgba(255,255,255,.8)', spacing: 3 });
      text('279 999 soʻm', 787, y + 18, { size: 52, weight: 900, color: YEL });
      ctx.restore();
    }
    const k4 = seg(t, c0 + 1.3, c0 + 1.6);
    text('AVERON — sifat va qulay narx!', W / 2, 1640, { size: 50, weight: 800, color: '#fff', alpha: k4 });
    sparkles(t, W / 2, 1790, 960, 21, YEL, 140);
  }

  // ---- transitions
  wipe(seg(t, S.product[0] - .25, S.product[0] + .25), BLUE);
  flash(seg(t, S.product[0], S.product[0] + .25));
  flash(seg(t, S.wall[0], S.wall[0] + .2));
  flash(seg(t, S.cash[0] + .5, S.cash[0] + .7));
  flash(seg(t, S.credit[0], S.credit[0] + .2));
  wipe(seg(t, S.cta[0] - .3, S.cta[0] + .2), RED);
  flash(seg(t, S.cta[0], S.cta[0] + .25));

  // small logo watermark (product → credit), hidden while the wall headline is up
  {
    const a = win(t, S.product[0] + .3, S.cta[0] - .1, .3, .2);
    if (a > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); logo(160, 80, 46, t, { color: INK, accent: BLUE, alpha: a * .9 }); }
  }
}

window.drawFrame = drawFrame;
window.DUR = DUR;
window.ready = (async () => {
  for (const wgt of [900, 800, 700, 600]) await document.fonts.load(`${wgt} 100px ${FONT}`);
  if (new URLSearchParams(location.search).get('photo')) {
    photo = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = 'product.png'; });
  }
  drawFrame(0);
  return true;
})();
if (!navigator.webdriver) {
  const t0 = performance.now();
  const loop = () => { drawFrame(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
